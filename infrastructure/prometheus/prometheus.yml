global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
    relabel_configs:
      - source_labels: [job]
        target_label: application
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]
    relabel_configs:
      - source_labels: [job]
        target_label: application
  - job_name: ingestion-service
