{{- if .Values.dependencies.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siem-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: siem-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siem-redis
  template:
    metadata:
      labels:
        app: siem-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: siem-redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: siem-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}