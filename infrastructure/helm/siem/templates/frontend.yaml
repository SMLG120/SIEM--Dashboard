{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siem-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: siem-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siem-frontend
  template:
    metadata:
      labels:
        app: siem-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "siem.podSecurityContext" 101 | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: frontend
          securityContext:
            {{- include "siem.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: siem-frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: siem-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}