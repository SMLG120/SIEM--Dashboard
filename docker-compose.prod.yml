# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - Caddy is the only container with published ports (80/443) and terminates HTTPS.
#   One public origin: /  -> dashboard, /api -> gateway, /auth -> Keycloak.
# - Every other service is reachable only on the internal Compose network.
# - Keycloak runs in production mode on PostgreSQL; the admin console is not exposed publicly.
# Required .env keys are generated by infrastructure/deploy/make-env.sh.

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      SIEM_SITE_ADDRESS: ${SIEM_SITE_ADDRESS:?SIEM_SITE_ADDRESS is required}
      SIEM_TLS_MODE: ${SIEM_TLS_MODE:-auto}
    ports:
      - "${SIEM_HTTP_PORT:-80}:80"
      - "${SIEM_HTTPS_PORT:-443}:443"
      - "${SIEM_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - api-gateway
      - keycloak

  postgres:
    restart: unless-stopped
    environment:
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    ports: !reset []
    volumes:
      - ./infrastructure/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro

  redis:
    restart: unless-stopped
    ports: !reset []

  opensearch:
    restart: unless-stopped
    ports: !reset []

  kafka:
    restart: unless-stopped
    ports: !reset []

  kafka-ui:
    ports: !reset []

  mailpit:
    # No public mail catcher in production; password reset is disabled below instead.
    profiles: ["local-mail"]
    ports: !reset []

  keycloak:
    restart: unless-stopped
    mem_limit: 1g
    # Admin console only via SSH tunnel: ssh -L 18088:localhost:18088 siem@<ip>
    ports: !override
      - "127.0.0.1:18088:8080"
    depends_on: !override
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: ${SIEM_PUBLIC_URL:?SIEM_PUBLIC_URL is required}/auth
      KC_HOSTNAME_ADMIN: http://localhost:18088/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      SIEM_FRONTEND_ORIGIN: ${SIEM_PUBLIC_URL}
    command:
      # Same realm template as local, but password reset is turned off (there is no real SMTP relay).
      - >-
        mkdir -p /opt/keycloak/data/import && sed -e "s|__SIEM_DEMO_PASSWORD__|$$SIEM_DEMO_PASSWORD|g" -e "s|__SIEM_PUBLIC_DEMO_PASSWORD__|$$SIEM_PUBLIC_DEMO_PASSWORD|g" -e "s|__SIEM_FRONTEND_ORIGIN__|$$SIEM_FRONTEND_ORIGIN|g" -e 's|"resetPasswordAllowed": true|"resetPasswordAllowed": false|' /opt/keycloak/data/import-template/enterprise-siem-realm.json.template > /opt/keycloak/data/import/enterprise-siem-realm.json && exec /opt/keycloak/bin/kc.sh start --import-realm

  api-gateway:
    restart: unless-stopped
    ports: !reset []
    environment:
      SIEM_ALLOWED_ORIGIN: ${SIEM_PUBLIC_URL}

  frontend:
    restart: unless-stopped
    ports: !reset []
    build:
      args:
        VITE_API_BASE_URL: ${SIEM_PUBLIC_URL}
        VITE_KEYCLOAK_URL: ${SIEM_PUBLIC_URL}/auth

  auth-service: { restart: unless-stopped }
  ingestion-service: { restart: unless-stopped }
  detection-service: { restart: unless-stopped }
  alert-service: { restart: unless-stopped }
  incident-service: { restart: unless-stopped }
  threat-intelligence-service: { restart: unless-stopped }
  audit-service: { restart: unless-stopped }
  search-service: { restart: unless-stopped }

  prometheus:
    restart: unless-stopped
    ports: !reset []

  grafana:
    restart: unless-stopped
    # Only via SSH tunnel: ssh -L 13000:localhost:13000 siem@<ip>
    ports: !override
      - "127.0.0.1:13000:3000"

volumes:
  caddy-data:
  caddy-config:
